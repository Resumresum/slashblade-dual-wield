name: Publish reviewed 0.4.1 prerelease

on:
  push:
    branches: [main]
    paths: ["distribution/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify reviewed release checksums
        run: |
          cd distribution
          sha256sum --check SHA256SUMS.txt
          echo 'ba663e59741a5ec0b5fd2b9e55e1b41af1cccbf702a169e088f2c6f29149564f  slashblade-dual-wield-0.4.1-experimental-source.zip' | sha256sum --check
      - name: Import reviewed source with protected author email
        run: |
          unzip -q -o distribution/slashblade-dual-wield-0.4.1-experimental-source.zip
          git config user.name 'R1sum_'
          git config user.email '88701815+Resumresum@users.noreply.github.com'
          git add src docs README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md build.ps1 test.ps1 '*.cmd' .gitignore
          if ! git diff --cached --quiet; then
            git commit -m 'Publish complete privacy-reviewed 0.4.1 source'
            git push origin HEAD:main
          fi
      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.1-experimental distribution/*.jar distribution/*.zip distribution/SHA256SUMS.txt \
            --target "$(git rev-parse HEAD)" \
            --title '拔刀剑双刀 0.4.1 · 公开测试版' \
            --prerelease --notes-file docs/RELEASE_NOTES.md
